<svg width="95" height="65" viewBox="0 0 95 65" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PlotTwist Layered Tiramisu / Opera Cake Slice on Plate (Modeled after Reference) -->

  <!-- Ceramic Dessert Plate / Saucer -->
  <ellipse cx="48" cy="42" rx="42" ry="17" fill="#F4EDE4" stroke="#3B2922" stroke-width="2.5" />
  <!-- Plate Inner Ring Accent -->
  <path d="M58 52 C70 51 80 46 82 41" stroke="#3B2922" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Mint Garnish on Left of Plate -->
  <g transform="translate(14, 34)">
    <path d="M7 6 C1 2 -2 5 0 9 C2 12 6 10 7 6 Z" fill="#2E8B67" stroke="#3B2922" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M8 8 C11 5 15 5 14 9 C13 13 9 12 8 8 Z" fill="#3EAA80" stroke="#3B2922" stroke-width="1.8" stroke-linejoin="round" />
  </g>

  <!-- Roasted Hazelnut Halves on Plate -->
  <circle cx="29" cy="43" r="2.8" fill="#ECA552" stroke="#3B2922" stroke-width="1.8" />
  <circle cx="28" cy="42" r="1.2" fill="#FFF2DA" />
  <circle cx="34" cy="44" r="2.8" fill="#D8923F" stroke="#3B2922" stroke-width="1.8" />
  <circle cx="33" cy="43" r="1.2" fill="#FFF2DA" />

  <!-- Main Cake Slice Block (3D Perspective: Front-Left Side & Front-Right Side) -->
  <g transform="translate(24, 18)">
    
    <!-- LEFT SIDE OF CAKE SLICE -->
    <g>
      <!-- Base Outline & Fill -->
      <path d="M0 8 L20 18 V34 L0 24 Z" fill="#C5B09E" stroke="#3B2922" stroke-width="2.5" stroke-linejoin="round" />
      
      <!-- Left Side Layers -->
      <!-- Bottom Layer 1: Base Sponge -->
      <path d="M0 20 L20 30 V34 L0 24 Z" fill="#C8914B" stroke="#3B2922" stroke-width="1.2" />
      <!-- Layer 2: Coffee Mascarpone Cream -->
      <path d="M0 16 L20 26 V30 L0 20 Z" fill="#E8D9C8" stroke="#3B2922" stroke-width="1.2" />
      <!-- Layer 3: Espresso Sponge -->
      <path d="M0 12 L20 22 V26 L0 16 Z" fill="#DFA058" stroke="#3B2922" stroke-width="1.2" />
      <!-- Layer 4: Light Cream -->
      <path d="M0 8 L20 18 V22 L0 12 Z" fill="#F4EAE0" stroke="#3B2922" stroke-width="1.2" />
    </g>

    <!-- RIGHT / FRONT SIDE OF CAKE SLICE -->
    <g>
      <!-- Base Outline & Fill -->
      <path d="M20 18 L50 9 V25 L20 34 Z" fill="#E0A766" stroke="#3B2922" stroke-width="2.5" stroke-linejoin="round" />
      
      <!-- Right Side Layers -->
      <!-- Bottom Layer 1: Base Sponge -->
      <path d="M20 30 L50 21 V25 L20 34 Z" fill="#D3974D" stroke="#3B2922" stroke-width="1.2" />
      <!-- Layer 2: Coffee Mascarpone Cream -->
      <path d="M20 26 L50 17 V21 L20 30 Z" fill="#EFE3D5" stroke="#3B2922" stroke-width="1.2" />
      <!-- Layer 3: Espresso Soaked Sponge -->
      <path d="M20 22 L50 13 V17 L20 26 Z" fill="#EAA95A" stroke="#3B2922" stroke-width="1.2" />
      <!-- Layer 4: Top Cream -->
      <path d="M20 18 L50 9 V13 L20 22 Z" fill="#FFF4EB" stroke="#3B2922" stroke-width="1.2" />
      
      <!-- Sponge Crumbs / Pores -->
      <circle cx="26" cy="24" r="0.8" fill="#996024" />
      <circle cx="38" cy="20" r="0.8" fill="#996024" />
      <circle cx="44" cy="18" r="0.8" fill="#996024" />
      <circle cx="32" cy="32" r="0.8" fill="#996024" />
      <circle cx="42" cy="23" r="0.8" fill="#996024" />
    </g>

    <!-- TOP SURFACE: GLOSSY CHOCOLATE FUDGE GLAZE (With Wavy Drips) -->
    <!-- Top Rhombus + Drips -->
    <path d="M0 8 L26 0 L50 9 L20 18 Z" fill="#3D2014" stroke="#3B2922" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Scalloped Drip Over Front Edge -->
    <path d="M-1 7 C1 10 4 10 6 8 C8 11 11 11 13 8 C15 11 18 10 20 18 C22 18 24 16 27 18 C30 20 33 16 36 17 C39 19 42 16 45 16 C48 16 49 13 51 9 L50 8 L26 0 L0 8 Z" fill="#4B2819" stroke="#3B2922" stroke-width="2" stroke-linejoin="round" />

    <!-- Glaze High-Gloss Shine Lines -->
    <path d="M12 5 L24 2" stroke="#75442F" stroke-width="1.5" stroke-linecap="round" />
    <path d="M28 6 L38 3" stroke="#75442F" stroke-width="1.5" stroke-linecap="round" />

    <!-- Scattered Toasted Hazelnut Chunks & Praline Pearls on Top -->
    <!-- Large Hazelnut Nugget -->
    <path d="M20 3 C22 1 27 2 28 5 C26 7 21 6 20 3 Z" fill="#ECA552" stroke="#3B2922" stroke-width="1.5" />
    <circle cx="24" cy="4" r="1.2" fill="#FFF2DA" />
    
    <!-- Medium Nut Nugget Left -->
    <path d="M11 5 C13 3 17 4 16 7 C14 8 11 7 11 5 Z" fill="#D8923F" stroke="#3B2922" stroke-width="1.2" />
    
    <!-- Medium Nut Nugget Right -->
    <path d="M34 4 C36 2 39 3 38 6 C36 7 34 6 34 4 Z" fill="#ECA552" stroke="#3B2922" stroke-width="1.2" />

    <!-- Crunchy Praline Crunch Pearls -->
    <circle cx="17" cy="8" r="1.3" fill="#FFE5BA" stroke="#3B2922" stroke-width="1" />
    <circle cx="23" cy="9" r="1.4" fill="#FFE5BA" stroke="#3B2922" stroke-width="1" />
    <circle cx="30" cy="8" r="1.2" fill="#FFE5BA" stroke="#3B2922" stroke-width="1" />
    <circle cx="41" cy="6" r="1.3" fill="#FFE5BA" stroke="#3B2922" stroke-width="1" />
  </g>
</svg>
