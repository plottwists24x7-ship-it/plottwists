<svg width="90" height="32" viewBox="0 0 90 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Slow Churned Daily Oval Sticker (PlotTwist Scrapbook Style) -->
  <!-- Shadow -->
  <rect x="5" y="5" width="82" height="24" rx="12" fill="#3B2922" opacity="0.15" />

  <!-- Label Body -->
  <rect x="3" y="3" width="82" height="24" rx="12" fill="#F8DD78" stroke="#3B2922" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Stitched dashed inner border -->
  <rect x="6" y="6" width="76" height="18" rx="9" fill="none" stroke="#3B2922" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6" />

  <!-- Text -->
  <text x="44" y="19" font-family="'Space Grotesk', ui-monospace, sans-serif" font-size="9" font-weight="700" fill="#3B2922" text-anchor="middle" letter-spacing="0.5">
    ✦ SLOW CHURNED
  </text>
</svg>

