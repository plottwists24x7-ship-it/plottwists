<svg width="70" height="85" viewBox="0 0 70 85" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chocolate Mocha Oreo Pudding Jar (PlotTwist Scrapbook Style) -->
  <!-- Shadow -->
  <rect x="13" y="22" width="44" height="56" rx="9" fill="#3B2922" opacity="0.15" />

  <!-- Jar Glass -->
  <rect x="11" y="18" width="44" height="56" rx="9" fill="#FFFDF8" stroke="#3B2922" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Layer 1: Dark Oreo Crumb Base -->
  <path d="M13 58 H53 V66 C53 71 49 73 44 73 H22 C17 73 13 71 13 66 Z" fill="#2E1F1A" />
  <circle cx="20" cy="65" r="1.5" fill="#FFF" opacity="0.4" />
  <circle cx="32" cy="67" r="1.5" fill="#FFF" opacity="0.4" />
  <circle cx="45" cy="65" r="1.5" fill="#FFF" opacity="0.4" />
  <line x1="12" y1="58" x2="54" y2="58" stroke="#3B2922" stroke-width="2.5" />

  <!-- Layer 2: Mocha Cream Pudding (Center) -->
  <rect x="13" y="38" width="40" height="20" fill="#93674E" />
  <line x1="12" y1="38" x2="54" y2="38" stroke="#3B2922" stroke-width="2.5" />

  <!-- Layer 3: Whipped Vanilla Layer with Mini Oreo Topping -->
  <rect x="13" y="20" width="40" height="18" rx="3" fill="#FFF8EE" />

  <!-- Mini Oreo Cookie on top cream -->
  <ellipse cx="33" cy="27" rx="8" ry="4" fill="#2E1F1A" stroke="#3B2922" stroke-width="2" />
  <ellipse cx="33" cy="29" rx="8" ry="2" fill="#FFFFFF" />
  <ellipse cx="33" cy="31" rx="8" ry="4" fill="#2E1F1A" stroke="#3B2922" stroke-width="2" />

  <!-- Jar Neck & Lid -->
  <rect x="16" y="12" width="34" height="8" rx="2" fill="#F3B7C5" stroke="#3B2922" stroke-width="3" />
  <!-- Bow Tie String -->
  <circle cx="33" cy="16" r="2.5" fill="#F45B73" />
  <path d="M31 16 C25 14 24 18 31 16 Z" fill="#F45B73" stroke="#3B2922" stroke-width="1.2" />
  <path d="M35 16 C41 14 42 18 35 16 Z" fill="#F45B73" stroke="#3B2922" stroke-width="1.2" />

  <!-- Highlight -->
  <path d="M16 24 V50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>

