<svg width="160" height="44" viewBox="0 0 160 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PlotTwist Tactile Yellow Washi Tape (Torn Edge Physical Paper) -->
  <defs>
    <!-- Fine Paper Grain Pattern -->
    <pattern id="yellow-grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FDE578" />
      <circle cx="2" cy="2" r="0.5" fill="#E8C94A" opacity="0.4" />
      <circle cx="6" cy="5" r="0.5" fill="#E8C94A" opacity="0.4" />
      <line x1="0" y1="4" x2="8" y2="4" stroke="#FFF7B8" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Physical Paper Shadow -->
  <path d="M4 6 L1 11 L5 16 L2 21 L5 26 L1 31 L4 36 L154 36 L157 31 L153 26 L157 21 L154 16 L158 11 L154 6 Z" fill="#3B2922" opacity="0.14" transform="translate(1.5, 2.5)" />

  <!-- Tape Body with Torn Fibrous Ends -->
  <path d="M4 6 
    L1 11 L5 16 L2 21 L5 26 L1 31 L4 36 
    Q 80 37 154 36 
    L157 31 L153 26 L157 21 L154 16 L158 11 L154 6 
    Q 80 5 4 6 Z" 
    fill="url(#yellow-grain)" stroke="#3B2922" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Subtle Top Highlight / Translucent Sheen -->
  <path d="M12 11 Q 80 10 148 11" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />

  <!-- Micro Paper Fibers / Creases -->
  <line x1="38" y1="8" x2="41" y2="34" stroke="#E2BF38" stroke-width="0.8" opacity="0.35" stroke-dasharray="2 3" />
  <line x1="118" y1="8" x2="116" y2="34" stroke="#E2BF38" stroke-width="0.8" opacity="0.35" stroke-dasharray="2 3" />
</svg>
