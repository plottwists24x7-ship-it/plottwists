<svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glossy Red Cherries Pair (PlotTwist Scrapbook Style) -->
  <!-- Shadow -->
  <ellipse cx="25" cy="45" rx="18" ry="4" fill="#3B2922" opacity="0.15" />

  <!-- Left Cherry -->
  <circle cx="16" cy="34" r="11" fill="#E63956" stroke="#3B2922" stroke-width="3" />
  <circle cx="13" cy="31" r="3" fill="#FFFFFF" opacity="0.75" />

  <!-- Right Cherry -->
  <circle cx="34" cy="32" r="11" fill="#D32542" stroke="#3B2922" stroke-width="3" />
  <circle cx="31" cy="29" r="3" fill="#FFFFFF" opacity="0.75" />

  <!-- Stems joining at top -->
  <path d="M16 23 C18 14 23 8 26 6" stroke="#3B2922" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M34 21 C32 14 28 8 26 6" stroke="#3B2922" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Green Leaf at Join -->
  <path d="M26 6 C32 4 38 7 36 12 C30 14 27 10 26 6 Z" fill="#78B159" stroke="#3B2922" stroke-width="2" />
  <line x1="27" y1="7" x2="34" y2="10" stroke="#3B2922" stroke-width="1.2" />
</svg>
