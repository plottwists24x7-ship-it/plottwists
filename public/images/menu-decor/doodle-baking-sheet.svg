<svg width="75" height="55" viewBox="0 0 75 55" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Baking Tray Sheet with Warm Cookies (PlotTwist Scrapbook Style) -->
  <!-- Shadow -->
  <polygon points="12,12 68,6 62,48 6,54" fill="#3B2922" opacity="0.15" />

  <!-- Metal Sheet Tray Body -->
  <polygon points="10,8 66,2 60,44 4,50" fill="#EADDC8" stroke="#3B2922" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Inner Rim -->
  <polygon points="13,11 63,6 58,41 8,46" fill="#FFFDF8" stroke="#3B2922" stroke-width="1.8" />

  <!-- Cookie 1 (Left) -->
  <g transform="translate(14, 24)">
    <circle cx="8" cy="8" r="7" fill="#E8A854" stroke="#3B2922" stroke-width="2" />
    <circle cx="6" cy="6" r="1.2" fill="#3B2922" />
    <circle cx="10" cy="9" r="1.2" fill="#3B2922" />
  </g>

  <!-- Cookie 2 (Center) -->
  <g transform="translate(32, 17)">
    <circle cx="8" cy="8" r="7.5" fill="#E8A854" stroke="#3B2922" stroke-width="2" />
    <circle cx="6" cy="6" r="1.2" fill="#3B2922" />
    <circle cx="10" cy="6" r="1.2" fill="#3B2922" />
    <circle cx="8" cy="11" r="1.2" fill="#3B2922" />
  </g>

  <!-- Cookie 3 (Right) -->
  <g transform="translate(48, 12)">
    <circle cx="7" cy="7" r="6.5" fill="#E8A854" stroke="#3B2922" stroke-width="2" />
    <circle cx="5" cy="6" r="1.2" fill="#3B2922" />
    <circle cx="9" cy="8" r="1.2" fill="#3B2922" />
  </g>
</svg>

