<svg width="160" height="44" viewBox="0 0 160 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PlotTwist Tactile Solid Pink Washi Tape -->
  <defs>
    <pattern id="pink-grain-v9" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#F88299" />
      <circle cx="2" cy="2" r="0.5" fill="#E6657F" opacity="0.4" />
      <circle cx="6" cy="5" r="0.5" fill="#E6657F" opacity="0.4" />
      <line x1="0" y1="4" x2="8" y2="4" stroke="#FFA8B9" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Physical Paper Shadow -->
  <path d="M4 6 L1 11 L5 16 L2 21 L5 26 L1 31 L4 36 L154 36 L157 31 L153 26 L157 21 L154 16 L158 11 L154 6 Z" fill="#3B2922" opacity="0.14" transform="translate(1.5, 2.5)" />

