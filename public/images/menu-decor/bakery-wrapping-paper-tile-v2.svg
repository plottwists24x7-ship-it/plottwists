<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- PlotTwist Printed Bakery Wrapping Paper — V2 (400x400 Seamless Staggered Tile) -->
  
  <!-- ════════ LAYER A: BASE PRINT (Warm Brown Line Art #795D4D @ 14% Opacity) ════════ -->
  <g stroke="#795D4D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.14">
    
    <!-- 1. Dessert Jar (Top Left Quadrant: x:32, y:28, rotate -12) -->
    <g transform="translate(32, 28) rotate(-12)">
      <rect x="3" y="6" width="18" height="24" rx="4" />
      <rect x="5" y="2" width="14" height="4" rx="1.5" />
      <line x1="3" y1="13" x2="21" y2="13" />
      <line x1="3" y1="20" x2="21" y2="20" />
      <path d="M7,17 C9,16 11,18 13,17 C15,16 17,18 18,17" />
    </g>

    <!-- 2. Plump Muffin (Top Center: x:150, y:22, rotate 10) -->
    <g transform="translate(150, 22) rotate(10)">
      <path d="M4,13 L6,25 H20 L22,13 Z" />
      <path d="M2,13 C1,7 6,4 10,4 C11,2 15,2 17,4 C21,5 24,8 23,13 Z" />
      <line x1="10" y1="14" x2="11" y2="24" />
      <line x1="16" y1="14" x2="15" y2="24" />
      <circle cx="8" cy="8" r="1" fill="#795D4D" />
      <circle cx="15" cy="7" r="1" fill="#795D4D" />
    </g>

    <!-- 3. Cupcake Swirl (Top Right: x:275, y:30, rotate -8) -->
    <g transform="translate(275, 30) rotate(-8)">
      <path d="M3,12 L5,22 H17 L19,12 Z" />
      <path d="M2,12 C1,8 5,5 9,5 C10,3 13,3 14,5 C18,5 20,9 19,12 Z" />
      <circle cx="11" cy="3" r="1.5" />
    </g>

    <!-- 4. Fudgy Brownie Square (Top Far Right: x:355, y:24, rotate 18) -->
    <g transform="translate(355, 24) rotate(18)">
      <rect x="0" y="0" width="18" height="15" rx="2" />
      <circle cx="5" cy="5" r="1.2" fill="#795D4D" />
      <circle cx="12" cy="7" r="1.2" fill="#795D4D" />
      <circle cx="7" cy="11" r="1.2" fill="#795D4D" />
    </g>

    <!-- 5. Cake Slice (x:85, y:95, rotate 15) -->
    <g transform="translate(85, 95) rotate(15)">
      <path d="M0,18 L20,6 L26,20 L4,26 Z" />
      <path d="M0,18 L4,26" />
      <line x1="2" y1="22" x2="23" y2="13" />
      <circle cx="10" cy="8" r="2" />
    </g>

    <!-- 6. Waffle Quarter Grid (x:205, y:85, rotate -14) -->
    <g transform="translate(205, 85) rotate(-14)">
      <rect x="0" y="0" width="22" height="22" rx="4" />
      <line x1="7" y1="2" x2="7" y2="20" />
      <line x1="15" y1="2" x2="15" y2="20" />
      <line x1="2" y1="7" x2="20" y2="7" />
      <line x1="2" y1="15" x2="20" y2="15" />
    </g>

    <!-- 7. Cherry Pair (x:330, y:95, rotate 5) -->
    <g transform="translate(330, 95) rotate(5)">
      <circle cx="6" cy="15" r="4" />
      <circle cx="16" cy="14" r="4" />
      <path d="M6,11 C8,5 11,2 12,1 C13,2 15,6 16,10" />
      <path d="M12,1 C15,0 17,2 16,4" />
    </g>

    <!-- 8. Tasting Spoon (x:20, y:180, rotate -35) -->
    <g transform="translate(20, 180) rotate(-35)">
      <ellipse cx="6" cy="6" rx="4.5" ry="6.5" />
      <line x1="6" y1="12.5" x2="6" y2="30" />
    </g>

    <!-- 9. Dessert Fork (x:135, y:165, rotate 25) -->
    <g transform="translate(135, 165) rotate(25)">
      <line x1="2" y1="2" x2="2" y2="10" />
      <line x1="6" y1="2" x2="6" y2="10" />
      <line x1="10" y1="2" x2="10" y2="10" />
      <path d="M2,10 C2,13 10,13 10,10" />
      <line x1="6" y1="12" x2="6" y2="28" />
    </g>

    <!-- 10. Wire Balloon Whisk (x:260, y:170, rotate -20) -->
    <g transform="translate(260, 170) rotate(-20)">
      <path d="M0,14 C-4,10 -5,4 0,0 C5,4 4,10 0,14 Z" />
      <line x1="0" y1="14" x2="0" y2="28" />
      <line x1="-2.5" y1="3" x2="-2.5" y2="12" />
      <line x1="2.5" y1="3" x2="2.5" y2="12" />
    </g>

    <!-- 11. Classic Rolling Pin (x:345, y:185, rotate 40) -->
    <g transform="translate(345, 185) rotate(40)">
      <rect x="7" y="2" width="22" height="7" rx="1.5" />
      <line x1="0" y1="5.5" x2="7" y2="5.5" />
      <line x1="29" y1="5.5" x2="36" y2="5.5" />
    </g>

    <!-- 12. Ceramic Mixing Bowl (x:70, y:255, rotate -10) -->
    <g transform="translate(70, 255) rotate(-10)">
      <path d="M2,6 C3,18 21,18 22,6 Z" />
      <line x1="0" y1="6" x2="24" y2="6" />
      <line x1="6" y1="18" x2="18" y2="18" />
    </g>

    <!-- 13. Scored Chocolate Bar (x:190, y:245, rotate 12) -->
    <g transform="translate(190, 245) rotate(12)">
      <rect x="0" y="0" width="22" height="15" rx="1.5" />
      <line x1="7.3" y1="0" x2="7.3" y2="15" />
      <line x1="14.6" y1="0" x2="14.6" y2="15" />
      <line x1="0" y1="7.5" x2="22" y2="7.5" />
    </g>

    <!-- 14. French Croissant (x:305, y:255, rotate -15) -->
    <g transform="translate(305, 255) rotate(-15)">
      <path d="M2,11 C5,6 11,4 16,4 C21,4 27,6 30,11 C26,14 20,13 16,12 C12,13 6,14 2,11 Z" />
      <path d="M10,7 C12,5 14,5 16,5 C18,5 20,5 22,7" />
    </g>

    <!-- 15. Choc Chip Cookie (x:25, y:330, rotate 8) -->
    <g transform="translate(25, 330) rotate(8)">
      <circle cx="11" cy="11" r="10" />
      <circle cx="7" cy="8" r="1.2" fill="#795D4D" />
      <circle cx="15" cy="7" r="1.2" fill="#795D4D" />
      <circle cx="12" cy="13" r="1.2" fill="#795D4D" />
      <circle cx="6" cy="14" r="1.2" fill="#795D4D" />
    </g>

    <!-- 16. Fresh Strawberry (x:135, y:335, rotate -18) -->
    <g transform="translate(135, 335) rotate(-18)">
      <path d="M4,6 C2,13 8,18 10,20 C12,18 18,13 16,6 C14,5 11,6 10,7 C9,6 6,5 4,6 Z" />
      <path d="M7,5 L10,1 L13,5" />
      <circle cx="8" cy="10" r="0.7" fill="#795D4D" />
      <circle cx="12" cy="11" r="0.7" fill="#795D4D" />
      <circle cx="10" cy="15" r="0.7" fill="#795D4D" />
    </g>

    <!-- 17. Mini Daisy Flower (x:235, y:335, rotate 20) -->
    <g transform="translate(235, 335) rotate(20)">
      <circle cx="8" cy="8" r="2.5" />
      <path d="M8,1 C9,4 9,4 8,5.5 M8,15 C9,12 9,12 8,10.5 M1,8 C4,9 4,9 5.5,8 M15,8 C12,9 12,9 10.5,8" />
    </g>

    <!-- 18. Tiny Heart (x:360, y:330, rotate -12) -->
    <g transform="translate(360, 330) rotate(-12)">
      <path d="M6,2 C4,-1 0,0 0,4 C0,8 6,12 6,12 C6,12 12,8 12,4 C12,0 8,-1 6,2 Z" />
    </g>

    <!-- 19. 4-Point Baker Star (x:175, y:115) -->
    <g transform="translate(175, 115)">
      <path d="M4,0 L5,3 L8,4 L5,5 L4,8 L3,5 L0,4 L3,3 Z" />
    </g>

    <!-- 20. Mini Baking Sheet / Tray (x:25, y:110, rotate -5) -->
    <g transform="translate(25, 110) rotate(-5)">
      <rect x="0" y="0" width="24" height="16" rx="2" />
      <circle cx="6" cy="8" r="2" />
      <circle cx="12" cy="8" r="2" />
      <circle cx="18" cy="8" r="2" />
    </g>

  </g>

  <!-- ════════ LAYER B: COLOR PRINTING (Sparse Pink, Ochre & Sky Inks @ 22% Opacity) ════════ -->
  <!-- Subtle Pink Berry & Cherry Accents (#EAA7B9) -->
  <g fill="#EAA7B9" opacity="0.24">
    <!-- Pink cherry fill at (330, 95) -->
    <circle cx="336" cy="110" r="3.2" />
    <circle cx="346" cy="109" r="3.2" />
    <!-- Pink strawberry body at (135, 335) -->
    <path d="M139,341 C137,347 142,352 144,354 C146,352 151,347 149,341 Z" />
    <!-- Tiny pink heart scatter -->
    <path transform="translate(115, 205) scale(0.7) rotate(8)" d="M6,2 C4,-1 0,0 0,4 C0,8 6,12 6,12 C6,12 12,8 12,4 C12,0 8,-1 6,2 Z" />
    <path transform="translate(360, 140) scale(0.65) rotate(-15)" d="M6,2 C4,-1 0,0 0,4 C0,8 6,12 6,12 C6,12 12,8 12,4 C12,0 8,-1 6,2 Z" />
  </g>

  <!-- Subtle Butter Yellow Stars & Waffle Butter Accents (#E9CC70) -->
  <g fill="#E9CC70" opacity="0.25">
    <!-- Butter pat on waffle at (205, 85) -->
    <rect x="213" y="93" width="6" height="6" rx="1.5" />
    <!-- Yellow 4-point star at (175, 115) -->
    <path transform="translate(175, 115)" d="M4,0 L5,3 L8,4 L5,5 L4,8 L3,5 L0,4 L3,3 Z" />
    <!-- Additional yellow sparkles -->
    <path transform="translate(45, 220) scale(0.85)" d="M4,0 L5,3 L8,4 L5,5 L4,8 L3,5 L0,4 L3,3 Z" />
    <path transform="translate(315, 45) scale(0.85)" d="M4,0 L5,3 L8,4 L5,5 L4,8 L3,5 L0,4 L3,3 Z" />
  </g>

  <!-- Subtle Powder Blue Floral & Bowl Accents (#A9C9F0) -->
  <g fill="#A9C9F0" opacity="0.22">
    <!-- Blue petal center at (235, 335) -->
    <circle cx="243" cy="343" r="3.5" />
    <!-- Small blue floral scatter -->
    <circle cx="95" cy="40" r="2.8" />
    <circle cx="270" cy="120" r="2.8" />
  </g>

  <!-- ════════ LAYER C: INK IMPERFECTIONS (Tiny Halftone Rosettes & Registration Crosses) ════════ -->
  <g stroke="#795D4D" stroke-width="0.75" opacity="0.12">
    <!-- Registration Cross 1 (x:5, y:200) -->
    <line x1="2" y1="200" x2="10" y2="200" />
    <line x1="6" y1="196" x2="6" y2="204" />
    <circle cx="6" cy="200" r="2.5" fill="none" />

    <!-- Registration Cross 2 (x:390, y:70) -->
    <line x1="386" y1="70" x2="394" y2="70" />
    <line x1="390" y1="66" x2="390" y2="74" />
    <circle cx="390" cy="70" r="2.5" fill="none" />

    <!-- Tiny Ink Flecks / Stipples -->
    <circle cx="160" cy="210" r="0.6" fill="#795D4D" />
    <circle cx="163" cy="212" r="0.5" fill="#795D4D" />
    <circle cx="161" cy="214" r="0.4" fill="#795D4D" />
    <circle cx="370" cy="285" r="0.6" fill="#795D4D" />
    <circle cx="372" cy="283" r="0.4" fill="#795D4D" />
  </g>

</svg>

