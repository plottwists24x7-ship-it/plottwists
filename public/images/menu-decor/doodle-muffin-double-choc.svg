<svg width="75" height="75" viewBox="0 0 75 75" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Double Chocolate Bakery Muffin (PlotTwist Scrapbook Style) -->
  <!-- Shadow -->
  <ellipse cx="37" cy="67" rx="26" ry="6" fill="#3B2922" opacity="0.15" />

  <!-- Pleated Paper Liner (Bottom) -->
  <polygon points="18,38 23,65 52,65 57,38" fill="#F8DD78" stroke="#3B2922" stroke-width="3.5" stroke-linejoin="round" />
  <!-- Pleat Lines -->
  <line x1="26" y1="38" x2="29" y2="65" stroke="#3B2922" stroke-width="2" />
  <line x1="33" y1="38" x2="35" y2="65" stroke="#3B2922" stroke-width="2" />
  <line x1="41" y1="38" x2="40" y2="65" stroke="#3B2922" stroke-width="2" />
  <line x1="48" y1="38" x2="46" y2="65" stroke="#3B2922" stroke-width="2" />

  <!-- Domed Chocolate Muffin Crown (Top) -->
  <path d="M14 38 
    C10 26 20 12 37 12 
    C54 12 65 26 61 38 
    C59 42 16 42 14 38 Z" 
    fill="#4A3125" stroke="#3B2922" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Chunky Chocolate Morsels / Chips -->
  <rect x="24" y="22" width="7" height="6" rx="1.5" fill="#241712" transform="rotate(15 24 22)" stroke="#3B2922" stroke-width="1.5" />
  <rect x="36" y="18" width="8" height="7" rx="1.5" fill="#241712" transform="rotate(-10 36 18)" stroke="#3B2922" stroke-width="1.5" />
  <rect x="47" y="26" width="7" height="6" rx="1.5" fill="#241712" transform="rotate(25 47 26)" stroke="#3B2922" stroke-width="1.5" />
  <rect x="28" y="32" width="6" height="5" rx="1.2" fill="#241712" transform="rotate(-15 28 32)" stroke="#3B2922" stroke-width="1.2" />

  <!-- Muffin cracks / texture lines -->
  <path d="M30 28 C34 26 38 29 42 27" stroke="#3B2922" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>

