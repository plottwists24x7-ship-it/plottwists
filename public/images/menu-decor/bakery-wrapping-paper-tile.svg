<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <!-- PlotTwist Printed Bakery Wrapping Paper Motif (Low-contrast 10% ink line art) -->
  <g stroke="#715B4C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.11">
    
    <!-- 1. Tiny Whisk (top left) -->
    <g transform="translate(24, 20) rotate(-20)">
      <path d="M0,12 C-3,8 -4,3 0,0 C4,3 3,8 0,12 Z"/>
      <line x1="0" y1="12" x2="0" y2="24"/>
      <line x1="-2" y1="2" x2="-2" y2="10"/>
      <line x1="2" y1="2" x2="2" y2="10"/>
    </g>

    <!-- 2. Tiny Rolling Pin (top right) -->
    <g transform="translate(180, 28) rotate(35)">
      <rect x="6" y="2" width="20" height="6" rx="1.5"/>
      <line x1="0" y1="5" x2="6" y2="5"/>
      <line x1="26" y1="5" x2="32" y2="5"/>
    </g>

    <!-- 3. Tiny Cherries (center left) -->
    <g transform="translate(30, 105)">
      <circle cx="5" cy="12" r="3.5"/>
      <circle cx="13" cy="11" r="3.5"/>
      <path d="M5,8 C7,4 9,2 10,1 C11,2 12,5 13,8"/>
    </g>

    <!-- 4. Tiny Dessert Jar (center right) -->
    <g transform="translate(190, 95) rotate(-10)">
      <rect x="2" y="5" width="14" height="18" rx="3"/>
      <rect x="4" y="2" width="10" height="3" rx="1"/>
      <line x1="3" y1="11" x2="15" y2="11"/>
      <line x1="3" y1="17" x2="15" y2="17"/>
    </g>

    <!-- 5. Tiny Croissant / Pastry (center) -->
    <g transform="translate(110, 80) rotate(15)">
      <path d="M2,10 C5,5 11,3 15,3 C19,3 25,5 28,10 C24,13 18,12 15,11 C12,12 6,13 2,10 Z"/>
      <path d="M10,6 C12,4 14,4 15,4 C16,4 18,4 20,6"/>
    </g>

    <!-- 6. Tiny Waffle Grid (bottom left) -->
    <g transform="translate(40, 185) rotate(12)">
      <rect x="0" y="0" width="18" height="18" rx="4"/>
      <line x1="6" y1="2" x2="6" y2="16"/>
      <line x1="12" y1="2" x2="12" y2="16"/>
      <line x1="2" y1="6" x2="16" y2="6"/>
      <line x1="2" y1="12" x2="16" y2="12"/>
    </g>

    <!-- 7. Tiny Cupcake (bottom center) -->
    <g transform="translate(125, 175) rotate(-15)">
      <path d="M3,10 L5,20 H15 L17,10 Z"/>
      <path d="M2,10 C1,7 4,4 7,4 C8,2 12,2 13,4 C16,4 19,7 18,10 Z"/>
      <circle cx="10" cy="2" r="1.5"/>
    </g>

    <!-- 8. Tiny Spoon & Flourish (bottom right) -->
    <g transform="translate(185, 180) rotate(-30)">
      <ellipse cx="6" cy="6" rx="4" ry="6"/>
      <line x1="6" y1="12" x2="6" y2="28"/>
    </g>

    <!-- 9. Tiny Stars / Sparkles scattered -->
    <g transform="translate(100, 30)">
      <path d="M4,0 L5,3 L8,4 L5,5 L4,8 L3,5 L0,4 L3,3 Z"/>
    </g>
    <g transform="translate(150, 130)">
      <path d="M3,0 L4,2 L6,3 L4,4 L3,6 L2,4 L0,3 L2,2 Z"/>
    </g>
    <g transform="translate(70, 145)">
      <circle cx="3" cy="3" r="1"/>
    </g>
  </g>
</svg>

