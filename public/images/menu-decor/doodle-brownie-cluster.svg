<svg width="85" height="75" viewBox="0 0 85 75" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PlotTwist Isometric Fudgy Brownie Cubes (Modeled after Reference) -->
  
  <!-- Ground Shadow -->
  <ellipse cx="44" cy="65" rx="34" ry="7" fill="#3B2922" opacity="0.16" />

  <!-- Back Brownie Cube (Offset Behind to the Right) -->
  <g transform="translate(30, 8)">
    <!-- Top Face (Rhombus) -->
    <path d="M22 0 L44 11 L22 22 L0 11 Z" fill="#6B4129" stroke="#3B2922" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left Face -->
    <path d="M0 11 L22 22 V36 L0 25 Z" fill="#422514" stroke="#3B2922" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Right Face -->
    <path d="M22 22 L44 11 V25 L22 36 Z" fill="#321A0C" stroke="#3B2922" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Top Chunks -->
    <polygon points="12,7 18,9 15,13 10,10" fill="#201007" />
    <polygon points="26,10 32,8 30,13 24,14" fill="#201007" />
  </g>

  <!-- Front Main Brownie Cube (Isometric Fudgy Cube) -->
  <g transform="translate(6, 18)">
    <!-- Top Crusted Surface (Rhombus) -->
    <path d="M24 0 L48 12 L24 24 L0 12 Z" fill="#75472E" stroke="#3B2922" stroke-width="3" stroke-linejoin="round" />
    <!-- Crinkly crust highlights -->
    <path d="M6 12 Q 14 8 24 10 Q 34 12 42 12" stroke="#9E6847" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M12 16 Q 22 18 32 14" stroke="#9E6847" stroke-width="1.5" stroke-linecap="round" fill="none" />
    
    <!-- Large Chocolate Chunk on Top Left -->
    <polygon points="10,6 18,7 15,13 8,11" fill="#261208" stroke="#3B2922" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M11 7 L17 8 L14 10" stroke="#5E331B" stroke-width="1" fill="none" />
    
    <!-- Medium Chocolate Chunk on Top Right -->
    <polygon points="28,8 36,10 34,16 26,14" fill="#261208" stroke="#3B2922" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- Scattered Chocolate Chips & Flakes -->
    <circle cx="21" cy="7" r="1.5" fill="#261208" />
    <circle cx="24" cy="17" r="1.8" fill="#261208" />
    <circle cx="39" cy="13" r="1.4" fill="#261208" />
    <circle cx="15" cy="17" r="1.3" fill="#FFE082" /> <!-- Flaky sea salt flake -->

    <!-- Front-Left Cut Surface (Fudgy Dense Interior) -->
    <path d="M0 12 L24 24 V44 L0 32 Z" fill="#4A2B18" stroke="#3B2922" stroke-width="3" stroke-linejoin="round" />
    <!-- Texture & Embedded Chunks -->
    <polygon points="6,20 12,22 10,27 4,24" fill="#261208" />
    <polygon points="14,29 20,31 18,36 12,34" fill="#261208" />
    <circle cx="8" cy="30" r="1.2" fill="#261208" />
    <circle cx="18" cy="24" r="1.4" fill="#261208" />
    <path d="M2 18 C3 22 1 26 3 28" stroke="#2B160B" stroke-width="1.2" stroke-linecap="round" />
    <path d="M15 38 C17 41 16 43 18 44" stroke="#2B160B" stroke-width="1.2" stroke-linecap="round" />

    <!-- Front-Right Cut Surface (Shadowed Fudgy Interior) -->
    <path d="M24 24 L48 12 V32 L24 44 Z" fill="#381E0F" stroke="#3B2922" stroke-width="3" stroke-linejoin="round" />
    <!-- Embedded Chunks in Shadow -->
    <polygon points="28,26 34,23 35,28 30,30" fill="#1C0C04" />
    <polygon points="36,18 42,16 43,21 37,23" fill="#1C0C04" />
    <circle cx="32" cy="35" r="1.5" fill="#1C0C04" />
    <circle cx="42" cy="26" r="1.3" fill="#1C0C04" />
    <circle cx="28" cy="39" r="1.2" fill="#1C0C04" />
  </g>

  <!-- Crumb on the table -->
  <circle cx="58" cy="63" r="1.8" fill="#3B1F13" />
  <circle cx="63" cy="62" r="1.2" fill="#3B1F13" />
  <circle cx="12" cy="61" r="1.5" fill="#3B1F13" />
</svg>
